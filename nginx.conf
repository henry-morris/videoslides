server {
    listen 8080;

    location = /isabelle {
        root /usr/share/nginx/html;
        try_files /isabelle/index.html =404;
    }
    location /isabelle/ {
        alias /usr/share/nginx/html/isabelle/;
        index index.html;
    }

    location = /ruby {
        root /usr/share/nginx/html;
        try_files /ruby/index.html =404;
    }
    location /ruby/ {
        alias /usr/share/nginx/html/ruby/;
        index index.html;
    }

    location = /emma {
        root /usr/share/nginx/html;
        try_files /emma/index.html =404;
    }
    location /emma/ {
        alias /usr/share/nginx/html/emma/;
        index index.html;
    }

    location = /bill {
        root /usr/share/nginx/html;
        try_files /bill/index.html =404;
    }
    location /bill/ {
        alias /usr/share/nginx/html/bill/;
        index index.html;
    }

    location = / {
        root /usr/share/nginx/html/root;
        try_files /index.html =404;
    }

    location /opening/ {
        alias /usr/share/nginx/html/opening/;
        index index.html;
    }

    location /closing/ {
        alias /usr/share/nginx/html/closing/;
        index index.html;
    }

    location / {
        return 404;
    }
}
